name: Collect Food Events (mail + dept boards)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Scan emails since date (YYYY-MM-DD). Leave empty for auto.'
        required: false
        default: ''
      backfill:
        description: 'Re-scan for missed events (insert-only). all = mail (since, default 45d) + boards'
        type: choice
        options: ['off', 'all', 'boards']
        default: 'off'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd scripts && npm ci
      - name: Run collection
        run: |
          cd scripts
          if [ "${{ inputs.backfill }}" = "boards" ]; then
            echo "Board-only backfill; skipping mail."
          elif [ "${{ inputs.backfill }}" = "all" ]; then
            npx tsx collect.ts --since=${{ inputs.since }} --backfill --max=3000
          elif [ -n "${{ inputs.since }}" ]; then
            npx tsx collect.ts --since=${{ inputs.since }}
          else
            npx tsx collect.ts
          fi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd scripts && npm ci
      - name: Crawl department notice boards
        run: |
          cd scripts
          if [ "${{ inputs.backfill }}" = "all" ] || [ "${{ inputs.backfill }}" = "boards" ]; then
            npx tsx crawl.ts --rescan
          else
            npx tsx crawl.ts
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
