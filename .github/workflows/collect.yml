name: Collect Food Events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Scan emails since date (YYYY-MM-DD). Leave empty for auto.'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd scripts && npm ci
      - name: Run collection
        run: |
          cd scripts
          if [ -n "${{ inputs.since }}" ]; then
            npx tsx collect.ts --since=${{ inputs.since }}
          else
            npx tsx collect.ts
          fi
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
